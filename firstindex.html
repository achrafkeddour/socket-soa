<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Broadcast Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    #chatBox { height: 300px; overflow-y: auto; margin-bottom: 1rem; }
    .message { margin-bottom: 0.5rem; }
    .system { font-style: italic; color: #6c757d; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h2 class="mb-4 text-center">📢 Broadcast Chat</h2>
    <div id="usernameContainer" class="mb-3">
      <input id="username" class="form-control" placeholder="Enter your username..." />
      <button id="joinBtn" class="btn btn-primary mt-2 w-100">Join Chat</button>
    </div>

    <div id="chatContainer" style="display:none;">
      <div class="d-flex justify-content-between mb-2">
        <strong>Online Users: <span id="userCount">0</span></strong>
        <span id="yourName" class="text-muted"></span>
      </div>
      <div id="chatBox" class="border rounded bg-white p-3"></div>
      <div class="input-group">
        <input id="message" class="form-control" placeholder="Type your message...">
        <button id="sendBtn" class="btn btn-success">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = "";

    const usernameInput = document.getElementById('username');
    const joinBtn = document.getElementById('joinBtn');
    const chatContainer = document.getElementById('chatContainer');
    const usernameContainer = document.getElementById('usernameContainer');
    const yourName = document.getElementById('yourName');
    const userCount = document.getElementById('userCount');

    joinBtn.addEventListener('click', () => {
      username = usernameInput.value.trim();
      if (username) {
        socket.emit('set username', username);
        chatContainer.style.display = 'block';
        usernameContainer.style.display = 'none';
        yourName.textContent = `You: ${username}`;
      }
    });

    socket.on('user count', count => {
      userCount.textContent = count;
    });

    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('message');
    const sendBtn = document.getElementById('sendBtn');

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const msg = messageInput.value.trim();
      if (msg) {
        socket.emit('chat message', msg);
        messageInput.value = '';
      }
    }

    socket.on('chat message', data => {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      msgDiv.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('system message', text => {
      const sysMsg = document.createElement('div');
      sysMsg.className = 'message system';
      sysMsg.textContent = text;
      chatBox.appendChild(sysMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
