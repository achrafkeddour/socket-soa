<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Broadcast Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f1f5f9;
      font-family: 'Segoe UI', sans-serif;
    }

    .chat-card {
      background: white;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      padding: 2rem;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      background-color: #f8fafc;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #e2e8f0;
    }

    .message {
      margin-bottom: 0.75rem;
    }

    .system {
      font-style: italic;
      color: #6b7280;
      font-size: 0.9rem;
    }

    .btn-primary, .btn-success {
      border-radius: 0.5rem;
    }

    .form-control {
      border-radius: 0.5rem;
    }

    .username-input {
      max-width: 400px;
      margin: 0 auto;
    }

    #chatContainer {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="chat-card">
          <h3 class="text-center mb-4">📢 Broadcast Chat</h3>

          <div id="usernameContainer" class="username-input">
            <input id="username" class="form-control" placeholder="Enter your username..." />
            <button id="joinBtn" class="btn btn-primary mt-3 w-100">Join Chat</button>
          </div>

          <div id="chatContainer">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="text-muted">Online Users: <span id="userCount">0</span></div>
              <div id="yourName" class="fw-semibold text-primary"></div>
            </div>

            <div id="chatBox"></div>

            <div class="input-group">
              <input id="message" class="form-control" placeholder="Type your message..." />
              <button id="sendBtn" class="btn btn-success">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = "";

    const usernameInput = document.getElementById('username');
    const joinBtn = document.getElementById('joinBtn');
    const chatContainer = document.getElementById('chatContainer');
    const usernameContainer = document.getElementById('usernameContainer');
    const yourName = document.getElementById('yourName');
    const userCount = document.getElementById('userCount');

    joinBtn.addEventListener('click', () => {
      username = usernameInput.value.trim();
      if (username) {
        socket.emit('set username', username);
        chatContainer.style.display = 'block';
        usernameContainer.style.display = 'none';
        yourName.textContent = `You: ${username}`;
      }
    });

    socket.on('user count', count => {
      userCount.textContent = count;
    });

    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('message');
    const sendBtn = document.getElementById('sendBtn');

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const msg = messageInput.value.trim();
      if (msg) {
        socket.emit('chat message', msg);
        messageInput.value = '';
      }
    }

    socket.on('chat message', data => {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      msgDiv.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('system message', text => {
      const sysMsg = document.createElement('div');
      sysMsg.className = 'message system';
      sysMsg.textContent = text;
      chatBox.appendChild(sysMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
